# EmotionSense theme: light, clean product style. Custom styling lives in src/ui/theme.py.
[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#eef0f5"
textColor = "#1f2430"
borderColor = "#e3e6ee"
linkColor = "#4f46e5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f8"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
