# EmotionSense theme: dark-first. Custom styling lives in src/ui/theme.py.
[theme]
base = "dark"
primaryColor = "#8b7cf6"
backgroundColor = "#0a0c16"
secondaryBackgroundColor = "#151a2c"
textColor = "#e9ebf7"
borderColor = "#262c45"
linkColor = "#a99ffb"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, Inter, sans-serif"
baseRadius = "0.9rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#0d1020"
secondaryBackgroundColor = "#161b30"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
